name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    # Para build Windows real necesitas un runner Windows.
    # Si todavía no tienes runner, esta línea fallará hasta que configures uno.
    runs-on: windows-latest

    permissions:
      contents: read

    timeout-minutes: 59

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show base environment
        shell: pwsh
        run: |
          Write-Host "=== OS ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "=== Python ==="
          python --version
          python -m pip --version

          Write-Host "=== Git ==="
          git --version

          Write-Host "=== CMake ==="
          cmake --version

          Write-Host "=== Ninja ==="
          ninja --version

      - name: Upgrade Python build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Install repository requirements with Windows fallback
        shell: pwsh
        run: |
          # El requirements.txt del repo incluye herramientas de build.
          # Si alguna dependencia Linux-only falla en Windows, Copilot podrá ver el fallo
          # y refactorizar requirements/setup/workflows con evidencia.
          python -m pip install -r requirements.txt

      - name: Validate PyTorch
        shell: pwsh
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import torch; print('torch cuda:', torch.version.cuda)"
          python -c "import torch; print('torch path:', torch.__file__)"

      - name: Validate CUDA compiler if available
        shell: pwsh
        run: |
          $nvcc = Get-Command nvcc -ErrorAction SilentlyContinue
          if ($nvcc) {
            Write-Host "nvcc found:"
            nvcc --version
          } else {
            Write-Host "nvcc not found in PATH"
          }

      - name: Validate setup.py dry run
        shell: pwsh
        run: |
          python setup.py --build-variant cuda --dryrun

      - name: Attempt Windows wheel build
        shell: pwsh
        run: |
          python setup.py --build-variant cuda bdist_wheel

      - name: List wheel artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Get-ChildItem -Recurse dist
          } else {
            Write-Host "No dist directory found."
          }
